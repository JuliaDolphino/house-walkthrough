<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>House Walkthrough</title>
<style>
  :root { --panel: rgba(20, 22, 26, 0.72); --text: #f2efe8; --accent: #e3b46c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9aa6b4; color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 12, 16, 0.45); z-index: 7; cursor: pointer; padding: 16px; box-sizing: border-box; }
  #overlay .card { background: var(--panel); border-radius: 12px; padding: 20px 24px; max-width: 360px;
    text-align: center; backdrop-filter: blur(6px); }
  #overlay h1 { font-size: 20px; margin: 0 0 8px; }
  #overlay p { margin: 6px 0; opacity: 0.9; }
  #overlay .go { margin-top: 14px; display: inline-block; padding: 8px 18px; border-radius: 999px;
    background: var(--accent); color: #222; font-weight: 600; }
  #overlay.hidden { display: none; }
  #unlock { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9;
    background: var(--panel); border-radius: 12px; padding: 20px 24px; width: min(320px, calc(100% - 32px));
    box-sizing: border-box; text-align: center; backdrop-filter: blur(6px); }
  #unlock h1 { font-size: 20px; margin: 0 0 8px; }
  #unlock p { margin: 6px 0; opacity: 0.9; }
  #unlock input { width: 100%; box-sizing: border-box; margin-top: 10px; padding: 9px 12px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(0, 0, 0, 0.25); color: var(--text);
    font: inherit; -webkit-user-select: text; user-select: text; }
  #unlock button { margin-top: 12px; padding: 8px 22px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--accent); color: #222; font: inherit; font-weight: 600; }
  #unlock button:disabled { opacity: 0.6; cursor: default; }
  #unlock .err { min-height: 1.4em; color: #ffd2c4; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6;
    background: var(--panel); padding: 10px 16px; border-radius: 8px; }
  #teleports { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    z-index: 6; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); }
  #teleports button { background: var(--panel); color: var(--text); border: 0; border-radius: 999px;
    padding: 6px 12px; font: inherit; cursor: pointer; }
  #teleports button:hover { background: rgba(60, 64, 72, 0.85); }
  /* phones and tablets: one swipeable row instead of a wall of pills */
  @media (max-width: 1100px), (pointer: coarse) {
    #teleports { left: 0; right: 0; transform: none; max-width: none; flex-wrap: nowrap;
      justify-content: flex-start; overflow-x: auto; overflow-y: hidden; touch-action: pan-x;
      overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      padding: 0 max(16px, env(safe-area-inset-right)) 2px max(16px, env(safe-area-inset-left));
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent);
      mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 16px), transparent); }
    #teleports::-webkit-scrollbar { display: none; }
    #teleports button { flex: 0 0 auto; white-space: nowrap; }
  }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
    border-radius: 50%; background: rgba(255, 255, 255, 0.7); z-index: 3; pointer-events: none; }
  #joy { position: fixed; left: max(24px, env(safe-area-inset-left)); bottom: max(24px, env(safe-area-inset-bottom));
    width: clamp(120px, 20vmin, 180px); height: clamp(120px, 20vmin, 180px); border-radius: 50%; background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(255, 255, 255, 0.35); z-index: 4; display: none; touch-action: none; }
  #joy .knob { position: absolute; left: 50%; top: 50%; width: 42%; height: 42%; translate: -50% -50%;
    border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
  body.touch #joy { display: block; }
  body.touch #crosshair { display: none; }
  body.drag-look canvas { cursor: grab; }
  body.drag-look canvas:active { cursor: grabbing; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js"
} }
</script>
</head>
<body>
<div id="status">Loading the house…</div>
<div id="teleports"></div>
<div id="crosshair"></div>
<div id="joy"><div class="knob"></div></div>
<div id="overlay" class="hidden">
  <div class="card">
    <h1>House walkthrough</h1>
    <p class="desk">Mouse to look · WASD or arrows to walk · Shift to run · Esc to pause</p>
    <p class="desk">If the mouse doesn't turn the view, drag or two-finger scroll to look</p>
    <p class="mob">Left stick to walk · drag on the right to look</p>
    <span class="go">Click to start</span>
  </div>
</div>
<script>window.HOUSE_ENCRYPTED = "house.enc";</script>
<script type="module" src="main.js?v=35"></script>
</body>
</html>
